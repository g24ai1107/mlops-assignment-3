name: CI Pipeline

on:
  push:
    branches:
      - docker_ci

jobs:
  build_and_test_container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install scikit-learn joblib

      - name: Train Model
        run: python train.py

      - name: Build Docker Image
        run: docker build -t mlops-assignment .

      - name: Run Docker Container
        run: docker run mlops-assignment

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Push Docker Image
        run: |
          docker tag mlops-assignment ${{ secrets.DOCKER_USERNAME }}/mlops-assignment
          docker push ${{ secrets.DOCKER_USERNAME }}/mlops-assignment

